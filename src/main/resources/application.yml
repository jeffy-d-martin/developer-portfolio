spring:
  application:
    name: portfolio
  datasource:
    url: ${database_url}
    username: ${database_user}
    password: ${database_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
# Server Configuration
server:
  port: 8080
  error:
    include-message: always # Ensures your custom exception messages are visible in the API response